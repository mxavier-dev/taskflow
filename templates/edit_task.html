{% extends 'base.html' %}

{% block title %}Edit Task - TaskFlow{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Task #{{ task.id }}</h1>
    <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-secondary">Back to List</a>
</div>

<form action="{{ url_for('tasks.edit_task', task_id=task.id) }}" method="POST" class="task-form">
    <div class="form-group">
        <label for="title">Title <span class="required">*</span></label>
        <input type="text" id="title" name="title" value="{{ task.title }}" required maxlength="200">
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5" maxlength="1000">{{ task.description }}</textarea>
    </div>

    <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status">
            {% for s in statuses %}
            <option value="{{ s }}" {% if s == task.status %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
            {% for p in priorities %}
            <option value="{{ p }}" {% if p == task.priority %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
